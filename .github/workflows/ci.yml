name: Build, Test, Security Scan & Deploy

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.dockerignore'

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-java@v5.5.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --parallel

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Cache Trivy DB
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ hashFiles('.trivyignore') }}
          restore-keys: |
            trivy-db-

      - name: Download Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Generate SBOM
        run: syft dir:. -o cyclonedx-json > sbom.json

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: sbom
          scan-ref: sbom.json
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  push-docker:
    if: >
      github.event_name == 'push' && (
        github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      )
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, order-service, payment-service]
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-java@v5.5.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build JAR
        run: ./gradlew :${{ matrix.service }}:bootJar -x test --parallel

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4.2.0

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          tags: |
            ghcr.io/rasmus2024/orbmrkt/${{ matrix.service }}:latest
            ghcr.io/rasmus2024/orbmrkt/${{ matrix.service }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/rasmus2024/orbmrkt/{0}:{1}', matrix.service, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
