services:
  order-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDER_SERVICE_DB_NAME}
      POSTGRES_USER: ${ORDER_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD}
    volumes:
      - order-service-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ORDER_SERVICE_DB_USER} -d ${ORDER_SERVICE_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  payment-service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PAYMENT_SERVICE_DB_NAME}
      POSTGRES_USER: ${PAYMENT_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_SERVICE_DB_PASSWORD}
    volumes:
      - payment-service-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PAYMENT_SERVICE_DB_USER} -d ${PAYMENT_SERVICE_DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    ports:
      - "9092:9092"
      - "29092:29092"

    volumes:
      - ./data/kafka:/tmp/kraft-combined-logs

    networks:
      - app-network

    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: LOCAL
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app-network

  order-service:
    restart: unless-stopped
    build:
      context: ./order-service
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    container_name: order-service
    ports:
      - "${ORDER_SERVICE_PORT}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      order-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s

  payment-service:
    restart: unless-stopped
    build:
      context: ./payment-service
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      payment-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s

  api-gateway:
    restart: unless-stopped
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: 1
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - app-network

volumes:
  order-service-data:
  payment-service-data:

networks:
  app-network:
    driver: bridge
