server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://order-service-db:5432/${ORDER_SERVICE_DB_NAME:orbmrkt_orders}
    username: ${ORDER_SERVICE_DB_USER:postgres}
    password: ${ORDER_SERVICE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "orbmrkt.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

outbox:
  polling-interval-ms: 500
  batch-size: 100
  max-attempts: 5
  cleanup-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health
